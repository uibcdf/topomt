name: Reading List
description: Essential papers and technical resources to guide our research, development, and architectural decisions.
title: "[Resource]: "
category: Reading List
body:
  - type: markdown
    attributes:
      value: |
        ### 📖 New Resource Proposal
        Please share the details of the paper or resource that could impact our project's direction.
  - type: input
    id: link
    attributes:
      label: Link or DOI
      placeholder: "e.g., https://doi.org/10.1038/..."
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why is this relevant?
      placeholder: "Explain how this affects our research, development, or architectural decisions."
    validations:
      required: true
