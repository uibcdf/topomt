body:
  - type: markdown
    attributes:
      value: "Essential papers and technical resources to guide our research, development, and architectural decisions."
  - type: input
    id: link
    attributes:
      label: Link or DOI
      placeholder: "e.g., https://doi.org/10.1038/..."
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why is this relevant?
      placeholder: "Explain how this affects our research, development, or architectural decisions."
    validations:
      required: true
