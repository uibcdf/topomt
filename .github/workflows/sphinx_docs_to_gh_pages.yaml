name: Documentation

on:
  release:
    types: ['released']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: false

env:
  SPHINXWORKING: 'True'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  documentation:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          create-args: python=3.14
      - name: Install reviewed source dependencies and TopoMT
        shell: bash -l {0}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --no-deps -r devtools/requirements/controlled_suite_dependencies_py314.txt
          python -m pip install --no-deps .
      - name: Build stored documentation and validate navigation
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python -m sphinx -E -a -b html -j 1 docs docs/_build/html
          python devtools/docs_site.py docs/_build/html --commit "$GITHUB_SHA"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_build/html
      - name: Deploy validated candidate
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
