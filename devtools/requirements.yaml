# Tooling only; metadata and reviewed contexts own Python/runtime.
setup:
  channels: &channels [uibcdf, conda-forge]
  dependencies: &setup_tools
    - pip
    - setuptools >=61.0
    - versioningit ~=2.0

production:
  channels: *channels
  dependencies: *setup_tools

test:
  channels: *channels
  dependencies: &test_tools
    - *setup_tools
    - nglview
    - pytest >=8
    - pytest-receptor
    - pytest-cov
    - pytest-xdist
    - codecov

docs:
  channels: *channels
  dependencies: &docs_tools
    - *setup_tools
    - nglview
    - jupyterlab
    - plantuml
    - graphviz
    - sphinx
    - pydata-sphinx-theme
    - sphinxcontrib-bibtex
    - sphinx-remove-toctrees
    - sphinx-copybutton
    - sphinx-design
    - sphinx-favicon
    - sphinx-tabs
    - sphinxcontrib-plantuml
    - myst-nb

development:
  channels: *channels
  dependencies:
    - *test_tools
    - *docs_tools
    - ipykernel
    - nbformat
    - nbclient
    - matplotlib
    - mamba

conda-build:
  channels: *channels
  dependencies: [anaconda-client, conda-build]
