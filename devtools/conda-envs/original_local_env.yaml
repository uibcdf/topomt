# Optional Linux/Python 3.14 source-build inputs for the original local providers.
# This is an opt-in tooling profile, not a replacement daily environment.
# Unchanged upstream pyKVFinder 0.9.6 additionally requires NumPy <2.5.
channels:
- conda-forge
dependencies:
- python>=3.14,<3.15
- pip
- numpy>=2.0,<2.6
- tomlkit>=0.14
- setuptools>=77.0.3
- wheel>=0.45
- swig>=4.4.1
- gcc_linux-64
- openjdk>=21,<22
# Original MoloVol CMake source build and Linux headless CLI runtime.
- cmake>=3.20
- wxwidgets>=3.3
- xorg-xvfb-server
