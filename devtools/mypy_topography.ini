[mypy]
files = topomt/topography/Topography.py, tests/typing/topography_queries.py
python_version = 3.11
explicit_package_bases = True
follow_imports = silent

# MolSysMT's editable runtime is verified separately. It does not currently
# supply a resolvable typing implementation for this bounded checker.
[mypy-molsysmt.*]
ignore_missing_imports = True

# Also used when explicitly selecting the unit bootstrap or DFND book example.
[mypy-pyunitwizard.*]
ignore_missing_imports = True
